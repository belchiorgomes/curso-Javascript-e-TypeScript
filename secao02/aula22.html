<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 22 seção 2</title>
</head>
<body>
    <script>
        let num1 = prompt('Digite um numero');
        let num2 = prompt('Digite outro numero');

        num1 = Number(num1);
        num2 = Number(num2);

        const resultado = num1 + num2;

        alert(`A soma entre ${num1} + ${num2} = ${resultado}`)
    </script>
</body>
