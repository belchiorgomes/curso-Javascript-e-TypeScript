<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const seuNome = prompt('Digite seu nome!');
        // console.log(seuNome);
        document.body.innerHTML += `Seu nome é <strong>${seuNome}</strong> <br>`;

        document.body.innerHTML += `Seu nome tem ${seuNome.length} letras <br>`

        document.body.innerHTML += `A segunda letra do seu nome é: ${seuNome[1]} <br>`

        document.body.innerHTML += `Qual o primeiro índice da letra 'f' no seu nome: ${seuNome.toLowerCase().indexOf('f')} <br>`

        document.body.innerHTML += `Qual o primeiro índice da letra 'f' no seu nome: ${seuNome.toLowerCase().lastIndexOf('f')} <br>`

        document.body.innerHTML += `As últimas 3 letras do seu nome são: ${seuNome.slice(-3)} <br>`

        document.body.innerHTML += `As palavras do seu nome são: ${seuNome.split(' ')} <br>`

        document.body.innerHTML += `Seu nome com letra maiúsculas: ${seuNome.toUpperCase()} <br>`

        document.body.innerHTML += `Seu nome com letra minúsculas: ${seuNome.toLowerCase()} <br>`
    </script>
</body>
</html>
