<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 34 do curso</title>
</head>
<body>
    <form class="form" action="#" method="get">
        <label for="nome">Nome:</label>
        <input class="nome" type="text" name="nome" id="nome"><br><br>

        <label for="sobrenome">Sobrenome:</label>
        <input class="sobrenome" type="text" name="sobrenome" id="sobrenome"><br><br>

        <label for="altura">Altura:</label>
        <input class="altura" type="text" name="alture" id="altura"><br><br>

        <label for="peso">Peso:</label>
        <input class="peso" type="text" name="peso" id="peso"><br><br>

        <button>Enviar</button>
    </form>

    <div class="resultado"></div>
    
    <script>
        function meuEscopo(){
            const form = document.querySelector('.form');
            const resultado = document.querySelector('.resultado');

            const pessoas = [];

            // form.onsubmit = function (evento){
            //     evento.preventDefault();
            //     alert('1')
            //     console.log('Ola')
            // };

            // let contador = 1;
            form.addEventListener('submit', function(evento){
                // evento.preventDefault();
                // console.log(`Form não enviado ${contador}`);
                // contador++;

                evento.preventDefault();

                const nome = form.querySelector('.nome');
                const sobrenome = form.querySelector('.sobrenome');
                const altura = form.querySelector('.altura');
                const peso = form.querySelector('.peso');

                pessoas.push({
                    nome: nome.value,
                    sobrenome: sobrenome.value,
                    altura: altura.value,
                    peso: peso.value
                });

                console.log(pessoas);

                resultado.innerHTML += `<p>${nome.value} ${sobrenome.value} ${altura.value} ${peso.value}</p>`;
            })
        }

        meuEscopo();
    </script>
</body>
</html>
